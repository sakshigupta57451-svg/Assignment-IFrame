<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .con{
            /* height: 600px; */
            /* border: 1px solid black; */
            display: flex;
        }
        .box{
            height: 100%;
            flex: 25%;
            /* border: 1px solid black; */
        }
        img{
            width: 100%;
        }
    </style>
</head>
<body>
    <h1 align="center">Dynamic Gallery</h1>
    <div class="con">
        <div class="box">
            <img src="Images/image1.jpg" alt="">
            <img src="Images/image2.jpg" alt="">
            <img src="Images/image3.jpg" alt="">
            <img src="Images/image4.jpg" alt="">
        </div>
        <div class="box">
            <img src="Images/image3.jpg" alt="">
            <img src="Images/image4.jpg" alt="">
            <img src="Images/image1.jpg" alt="">
            <img src="Images/image2.jpg" alt="">
        </div>
        <div class="box">
            <img src="Images/image2.jpg" alt="">
            <img src="Images/image3.jpg" alt="">
            <img src="Images/image4.jpg" alt="">
            <img src="Images/image1.jpg" alt="">
        </div>
        <div class="box">
            <img src="Images/image4.jpg" alt="">
            <img src="Images/image1.jpg" alt="">
            <img src="Images/image2.jpg" alt="">
            <img src="Images/image3.jpg" alt="">
        </div>
    </div>
</body>
</html>
